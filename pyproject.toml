[project]
name = "learning-authoring-tool"
version = "0.7.1"
description = "Portable multi-source native authoring skill with learner evidence and provisional mastery MVP"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pypdfium2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
learning-authoring = "learning_authoring.cli:main"
learning-authoring-product = "learning_authoring.product_cli:main"

[project.urls]
Repository = "https://github.com/Qyroven/KC-Quiz-Mastery"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["learning_authoring*"]
exclude = ["learning_authoring.legacy_api*"]

[tool.setuptools.package-data]
learning_authoring = [
  "prompts/*.md",
  "prompts/**/*.md",
  "prompts/**/*.json",
  "showcase_assets/*.html",
  "showcase_assets/*.json",
  "showcase_assets/*.js",
  "showcase_assets/*.css",
  "showcase_assets/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"learning_authoring/review.py" = ["E501"]
"learning_authoring/kc_review.py" = ["E501"]
"learning_authoring/quiz_review.py" = ["E501"]
